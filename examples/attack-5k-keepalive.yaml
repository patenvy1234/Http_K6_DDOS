version: 1
runName: smoke-5k-keepalive

target:
  rps: 5000
  durationSeconds: 300
  rampUpSeconds: 60
  rampDownSeconds: 30

endpoints:
  - id: trans-gif-keepalive
    method: GET
    url: https://example.com/apc/trans.gif
    weight: 1.0
    pattern: keepalive-burst

trafficShaping:
  discardResponseBodies: true
  http2: false
  insecureSkipTLSVerify: false
  userAgents:
    - ddos-loadgen/1.0

fleet:
  regions: [eastus2]
  vmSize: Standard_F4s_v2
  # auto-derive: ceil(5000 / 5000) = 1 VM
  maxVMCount: 6
  useSpot: true

lifecycle:
  ttlMinutes: 30
  cleanupOnInterrupt: true
